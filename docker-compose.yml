services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Passwort123.
      DB_NAME: community_feed
      TOKEN_PRIVATE_KEY: dev-secret-key
      CRON_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: Passwort123.
      MYSQL_DATABASE: community_feed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-pPasswort123."]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  mysql-data:
